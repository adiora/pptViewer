name: ppt_remote
description: "A Flutter mobile companion app for remotely controlling PowerPoint presentations with hardware volume buttons."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.0
  provider: ^6.1.1
  flutter_secure_storage: ^11.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
