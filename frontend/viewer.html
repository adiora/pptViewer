<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fullscreen PowerPoint slide viewer with mobile remote control integration.">
  <title>Slide Presenter — PPT Viewer</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>

<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.js';
  } else {
    console.error('PDF.js failed to load');
  }
</script>

</head>
<body class="viewer-body">
  <div id="toast-container" class="toast-container"></div>
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div id="loading-text">Loading presentation slides...</div>
  </div>

  <div id="slide-container">
    <canvas id="slide-canvas"></canvas>
    <div id="video-overlay" hidden>
      <video id="slide-video" controls></video>
    </div>
  </div>

  <button type="button" id="prev-arrow" class="nav-arrow nav-arrow--left" title="Previous Slide">‹</button>
  <button type="button" id="next-arrow" class="nav-arrow nav-arrow--right" title="Next Slide">›</button>

  <div id="slide-counter" class="slide-counter">
    <span id="current-slide">1</span> / <span id="total-slides">1</span>
  </div>

  <div id="connection-status" class="connection-status">
    <span id="connection-dot" class="connection-dot"></span>
    <span id="connection-text">Waiting for remote</span>
  </div>

  <div id="toolbar" class="toolbar">
    <span id="toolbar-code" class="toolbar__code">Code: ------</span>
    <button type="button" id="fullscreen-btn" class="btn-secondary btn-sm">Fullscreen</button>
    <a id="back-btn" href="/" class="btn-secondary btn-sm">Exit</a>
  </div>

  <script src="js/websocket-client.js"></script>
  <script defer src="js/viewer.js"></script>
</body>
</html>
