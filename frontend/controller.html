<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PPT Remote Control</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#09090b">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: var(--bg-primary);
    }
  </style>
</head>
<body>
  <div class="controller-card">
    <h2>Remote Control</h2>
    <div class="status" id="status-text"></div>
    
    <div id="setup-section">
      <input type="text" id="code-input" class="input-code" placeholder="Enter Code" maxlength="6" style="margin-bottom: 1rem; width: 100%; text-align: center;">
      <button id="connect-btn" class="btn-primary" style="margin-top: 0; width: 100%;">Connect</button>
    </div>

    <div id="controls-section" hidden>
      <div class="status" id="slide-info">Slide -- / --</div>
      <div class="controls">
        <button id="prev-btn" class="ctrl-btn">Prev</button>
        <button id="next-btn" class="ctrl-btn">Next</button>
      </div>
      <div class="controls">
        <button id="play-btn" class="ctrl-btn" style="font-size: 1rem; padding: 1rem;">Play/Pause Video</button>
      </div>
      <div class="volume-instruction">
        Ensure your phone's volume is up (but silent) to use physical volume buttons for navigation.
      </div>
    </div>
  </div>

  <audio id="silent-audio" loop src="data:audio/mp3;base64,//OlkAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAAFAAAACwAAAB4AAABGAAAAUQAAAGYAAAB2AAAAhAAAAJMAAACmAAAAtgAAAMYAAADXAAAA5gAAAPcAAAAGAAAAFgAAACYAAAA3AAAARwAAAFcAAABnAAAAeAAAAIgAAACYAAAAqAAAALgAAADJAAAA2QAAAOkAAAD5AAAA//OlkAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAAFAAAACwAAAB4AAABGAAAAUQAAAGYAAAB2AAAAhAAAAJMAAACmAAAAtgAAAMYAAADXAAAA5gAAAPcAAAAGAAAAFgAAACYAAAA3AAAARwAAAFcAAABnAAAAeAAAAIgAAACYAAAAqAAAALgAAADJAAAA2QAAAOkAAAD5AAAA"></audio>
  <script src="js/controller.js"></script>
</body>
</html>
