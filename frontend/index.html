<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPT Viewer</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>

  <main class="app-main">
    <section id="upload-section" class="card">
      <h2 class="card-title">PPT Viewer</h2>
      <p class="direct-instructions">Upload a .pptx or .pdf file to get a 6-character code, or enter an existing code.</p>

      <div id="drop-zone" class="drop-zone">
        <input type="file" id="file-input" accept=".ppt,.pptx,.pdf" hidden>
        <div class="drop-zone__content">
          <div class="drop-zone__text">Select or drag file here</div>
        </div>
      </div>

      <div id="file-info" class="file-info" hidden>
        <div class="file-info__details">
          <div id="file-name" class="file-info__name">presentation.pptx</div>
          <div id="file-size" class="file-info__size">2.4 MB</div>
        </div>
        <button type="button" id="file-remove-btn" class="file-info__remove" title="Remove file">Remove</button>
      </div>

      <div id="progress-container" class="progress-container" hidden>
        <div class="progress-header">
          <span id="progress-status-text">Uploading...</span>
          <span id="progress-text">0%</span>
        </div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-bar__fill"></div>
        </div>
      </div>

      <button type="button" id="upload-btn" class="btn-primary" disabled>
        Upload & Generate Code
      </button>

      <div class="join-session-box">
        <input type="text" id="join-code-input" class="input-code" placeholder="Enter Code" maxlength="6">
        <button type="button" id="join-btn" class="btn-secondary">Join</button>
      </div>
    </section>

    <section id="code-section" class="card" hidden>
      <div class="success-header">Session Active</div>
      
      <p class="direct-instructions">Your Controller Code:</p>

      <div class="code-display-wrapper">
        <span id="session-code" class="session-code">------</span>
        <button type="button" id="copy-btn" class="btn-icon">Copy</button>
      </div>

      <div class="meta-info" id="session-meta">
        <span><strong id="slide-count-meta">0</strong> slides</span>
        <span>Expires in 24 hours</span>
      </div>

      <a id="start-btn" class="btn-primary" href="#">Open Presenter View</a>
      <a id="pwa-controller-btn" class="btn-secondary" style="margin-top: 10px;" href="/controller.html">Open Mobile Remote</a>
    </section>
  </main>

  <script src="js/upload.js"></script>
</body>
</html>
